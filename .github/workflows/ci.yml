name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install numpy
      - name: test
        run: |
          set -e
          for t in python/*/test_*.py; do
            echo "== $t"
            python "$t"
          done

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: test
        run: cargo test --manifest-path rust/Cargo.toml --verbose
